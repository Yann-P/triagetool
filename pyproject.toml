[project]
name = "triagetool"
version = "0.2.0"
description = "Tools to help triaging GitHub Security Advisories with a reasonable use of AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
triagetool = "triagetool.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
